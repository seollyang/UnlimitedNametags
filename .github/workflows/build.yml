name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alexdev03/UnlimitedNametags
          ref: 1.6.8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Replace EntityLib dependency
        run: |
          sed -i 's|^entityLib = .*|entityLib = { module = "com.github.Tofaa2.EntityLib:spigot", version = "2.4.11" }|' gradle/libs.versions.toml
          grep -n "entityLib" gradle/libs.versions.toml
      - name: Warm up JitPack
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://jitpack.io/com/github/Tofaa2/EntityLib/spigot/2.4.11/spigot-2.4.11.pom)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 20
          done
      - run: chmod +x gradlew && ./gradlew shadowJar
      - uses: actions/upload-artifact@v4
        with:
          name: UnlimitedNametags
          path: target/UnlimitedNametags.jar
