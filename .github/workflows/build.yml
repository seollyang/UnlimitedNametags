name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alexdev03/UnlimitedNametags
          ref: 1.6.8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Replace EntityLib dependency
        run: |
          sed -i 's|^entityLib = .*|entityLib = { module = "com.github.Tofaa2.EntityLib:spigot", version = "2.4.11" }|' gradle/libs.versions.toml
      - name: Remove LibsDisguises hook (dead repo)
        run: |
          rm src/main/java/org/alexdev/unlimitednametags/hook/LibsDisguisesHook.java
          sed -i '/isPluginEnabled("LibsDisguises")/,/^        }/d' src/main/java/org/alexdev/unlimitednametags/UnlimitedNameTags.java
          sed -i '/libs\.disguises/d' build.gradle.kts
      - run: chmod +x gradlew && ./gradlew shadowJar
      - uses: actions/upload-artifact@v4
        with:
          name: UnlimitedNametags
          path: target/UnlimitedNametags.jar
